<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>무화과 · Fig — Signature Pairs</title>
<meta name="theme-color" content="#2c1d12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Pacifico&family=Caveat:wght@500&family=Reenie+Beanie&family=Shadows+Into+Light&family=Permanent+Marker&family=Lobster&family=Lobster+Two:wght@700&family=Sacramento&family=Satisfy&family=Rock+Salt&family=Patrick+Hand&family=Chewy&family=Jost:wght@400;500&family=Nanum+Pen+Script&family=Nanum+Brush+Script&family=Gaegu:wght@700&family=Gamja+Flower&family=Hi+Melody&family=Dokdo&family=Yeon+Sung&family=Single+Day&family=Stylish&family=East+Sea+Dokdo&family=Poor+Story&family=Cute+Font&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#ece7df; --muted:rgba(236,231,223,.58); --mamba:#b8d62b; --hair:rgba(255,255,255,.12);
    --thread:#c9a24a;
    --swatch: radial-gradient(120% 100% at 30% 0%, rgba(255,255,255,.09), transparent 48%), linear-gradient(158deg,#4b3624,#33241a 64%,#281a10);
    --ease:cubic-bezier(.23,1,.32,1);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html{overflow-x:hidden;-webkit-text-size-adjust:100%;}
  body{font-family:"Jost",system-ui,sans-serif;color:var(--paper);
    background:linear-gradient(170deg,#1a140e,#0b0906 72%);background-attachment:fixed;
    -webkit-font-smoothing:antialiased;min-height:100dvh;}
  .bar{position:sticky;top:0;z-index:20;display:flex;gap:12px 22px;flex-wrap:wrap;align-items:center;
    padding:calc(env(safe-area-inset-top) + 11px) 16px 11px;
    background:rgba(18,14,10,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--hair);}
  .grp{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .grp .lbl{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-right:2px;}
  .chip{font:inherit;font-size:12.5px;color:var(--paper);background:rgba(255,255,255,.06);border:1px solid var(--hair);
    border-radius:999px;padding:0 14px;height:36px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
    transition:background .18s var(--ease),border-color .18s,transform .12s var(--ease);}
  .chip .dot{width:11px;height:11px;border-radius:50%;border:1px solid rgba(255,255,255,.35);}
  .chip:active{transform:scale(.95);}
  .chip[aria-pressed="true"]{background:var(--mamba);color:#16200a;border-color:var(--mamba);font-weight:600;}
  .chip:focus-visible{outline:2px solid var(--mamba);outline-offset:2px;}
  @media(hover:hover){.chip:hover{border-color:rgba(184,214,43,.5);}}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:18px 16px 60px;max-width:1320px;margin:0 auto;}
  @media(max-width:1024px){.grid{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:600px){.grid{grid-template-columns:1fr;gap:14px;padding:14px 14px 48px;}}
  .card{border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,.07);
    box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 16px 36px -22px rgba(0,0,0,.85);
    transition:transform .4s var(--ease),box-shadow .3s var(--ease),opacity .5s var(--ease);}
  @media(scripting:enabled){.card{opacity:0;transform:translateY(12px);}.card.in{opacity:1;transform:none;}}
  @media(hover:hover){.card:hover{transform:translateY(-5px);box-shadow:0 22px 46px -22px rgba(0,0,0,.9),0 0 0 1px rgba(184,214,43,.22);}}
  .card:active{transform:scale(.992);transition-duration:.12s;}
  .swatch{background:var(--swatch);min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:22px 18px;position:relative;}
  .swatch::after{content:"";position:absolute;inset:11px;border:1px dashed rgba(255,255,255,.12);border-radius:9px;pointer-events:none;}
  .kr{color:var(--thread);font-size:clamp(54px,9vw,72px);line-height:1.05;letter-spacing:.04em;text-align:center;
    text-shadow:0 1px 1px rgba(0,0,0,.55),0 -1px 0 rgba(255,255,255,.10);transition:color .25s var(--ease);}
  .fig{color:var(--thread);font-size:clamp(38px,6.5vw,52px);line-height:1.05;text-align:center;
    text-shadow:0 1px 1px rgba(0,0,0,.55),0 -1px 0 rgba(255,255,255,.10);transition:color .25s var(--ease);opacity:.96;}
  .nm{font-size:10.5px;letter-spacing:.02em;color:var(--muted);padding:9px 12px;background:rgba(8,6,4,.6);border-top:1px solid var(--hair);text-align:center;line-height:1.4;}
  .nm b{color:rgba(236,231,223,.85);font-weight:600;}
  @media (prefers-reduced-motion: reduce){.card{opacity:1!important;transform:none!important;transition:box-shadow .2s ease;}}
</style>
</head>
<body>
  <div class="bar">
    <div class="grp" id="leathers">
      <span class="lbl">Leather</span>
      <button class="chip" data-leather="mamba" aria-pressed="false"><span class="dot" style="background:#3c5417"></span>Mamba</button>
      <button class="chip" data-leather="espresso" aria-pressed="true"><span class="dot" style="background:#4b3624"></span>Espresso</button>
      <button class="chip" data-leather="black" aria-pressed="false"><span class="dot" style="background:#1a1a16"></span>Black</button>
    </div>
    <div class="grp" id="threads">
      <span class="lbl">Thread</span>
      <button class="chip" data-thread="#c9a24a" aria-pressed="true"><span class="dot" style="background:#c9a24a"></span>Gold</button>
      <button class="chip" data-thread="#d4d7db" aria-pressed="false"><span class="dot" style="background:#d4d7db"></span>Silver</button>
      <button class="chip" data-thread="#f4f2ec" aria-pressed="false"><span class="dot" style="background:#f4f2ec"></span>White</button>
    </div>
  </div>

  <div class="grid" id="grid"></div>

<script>
  // [koreanFont, koreanWeight, latinFont, styleLabel] — matched by style
  var PAIRS=[
    ["Nanum Pen Script",400,"Allura","Fine pen"],
    ["Nanum Brush Script",400,"Pacifico","Brush"],
    ["Gaegu",700,"Caveat","Casual"],
    ["Gamja Flower",400,"Reenie Beanie","Thin note"],
    ["Hi Melody",400,"Shadows Into Light","Soft hand"],
    ["Dokdo",400,"Permanent Marker","Marker"],
    ["Yeon Sung",400,"Lobster","Bold brush"],
    ["Single Day",400,"Sacramento","Slim script"],
    ["Stylish",400,"Satisfy","Clean script"],
    ["East Sea Dokdo",400,"Rock Salt","Rough hand"],
    ["Poor Story",400,"Patrick Hand","Print hand"],
    ["Cute Font",400,"Chewy","Chunky"]
  ];
  var LEATHER={
    mamba:"radial-gradient(120% 100% at 30% 0%, rgba(255,255,255,.10), transparent 48%), linear-gradient(158deg,#3c5417,#27380e 68%,#1b2908)",
    espresso:"radial-gradient(120% 100% at 30% 0%, rgba(255,255,255,.09), transparent 48%), linear-gradient(158deg,#4b3624,#33241a 64%,#281a10)",
    black:"radial-gradient(120% 100% at 30% 0%, rgba(255,255,255,.08), transparent 48%), linear-gradient(158deg,#23231d,#151510 68%,#0b0b08)"
  };
  var grid=document.getElementById('grid'), root=document.documentElement;
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  PAIRS.forEach(function(p){
    var kf=p[0], kw=p[1], lf=p[2], lab=p[3];
    var c=document.createElement('article'); c.className='card';
    c.innerHTML=
      '<div class="swatch">'+
        '<span class="kr" style="font-family:\''+kf+'\';font-weight:'+kw+'">무화과</span>'+
        '<span class="fig" style="font-family:\''+lf+'\'">Fig</span>'+
      '</div>'+
      '<div class="nm"><b>'+lab+'</b> · '+kf+' + '+lf+'</div>';
    grid.appendChild(c);
  });
  var cards=Array.prototype.slice.call(grid.children);
  if(!reduce && 'IntersectionObserver' in window){
    var io=new IntersectionObserver(function(es){
      es.filter(function(e){return e.isIntersecting;})
        .sort(function(a,b){return cards.indexOf(a.target)-cards.indexOf(b.target);})
        .forEach(function(e,i){var el=e.target,d=Math.min(i,5)*50;el.style.transitionDelay=d+'ms';el.classList.add('in');io.unobserve(el);
          setTimeout(function(){el.style.transitionDelay='';},560+d);});
    },{rootMargin:'0px 0px -5% 0px',threshold:.05});
    cards.forEach(function(c){io.observe(c);});
  } else { cards.forEach(function(c){c.classList.add('in');}); }
  function wire(id,fn){var g=document.getElementById(id);g.addEventListener('click',function(e){var b=e.target.closest('.chip');if(!b)return;
    g.querySelectorAll('.chip').forEach(function(c){c.setAttribute('aria-pressed',c===b?'true':'false');});fn(b);});}
  wire('leathers',function(b){root.style.setProperty('--swatch',LEATHER[b.dataset.leather]);});
  wire('threads',function(b){root.style.setProperty('--thread',b.dataset.thread);});
</script>
</body>
</html>
