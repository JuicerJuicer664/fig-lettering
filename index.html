<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fig — Lettering</title>
<meta name="theme-color" content="#2c1d12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Allura&family=Sacramento&family=Parisienne&family=Pinyon+Script&family=Alex+Brush&family=Tangerine:wght@400;700&family=Yellowtail&family=Dancing+Script:wght@600&family=Kaushan+Script&family=Satisfy&family=Cookie&family=Niconne&family=Mr+Dafoe&family=Herr+Von+Muellerhoff&family=Italianno&family=Petit+Formal+Script&family=Style+Script&family=Playfair+Display:ital,wght@0,600;1,600&family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Bodoni+Moda:ital,wght@0,600;1,600&family=Cinzel:wght@600&family=Cinzel+Decorative:wght@700&family=EB+Garamond:ital,wght@0,600;1,500&family=Marcellus&family=Forum&family=Italiana&family=Tenor+Sans&family=Prata&family=DM+Serif+Display:ital@0;1&family=Bellefair&family=Cardo:ital@0;1&family=Montserrat:wght@700&family=Oswald:wght@600&family=Bebas+Neue&family=Anton&family=Archivo+Black&family=Poppins:wght@600&family=Jost:wght@500&family=Josefin+Sans:wght@600&family=Orbitron:wght@600&family=Audiowide&family=Michroma&family=Megrim&family=Monoton&family=Iceland&family=Rajdhani:wght@600&family=Syncopate:wght@700&family=UnifrakturMaguntia&family=Pirata+One&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#ece7df; --muted:rgba(236,231,223,.6); --mamba:#b8d62b; --hair:rgba(255,255,255,.12);
    --thread:#c9a24a;
    --swatch: radial-gradient(120% 100% at 28% 0%, rgba(255,255,255,.08), transparent 46%), linear-gradient(158deg,#4b3624,#33241620 60%,#2c1d12);
    --fig: clamp(58px, 11vw, 82px);
    --ease:cubic-bezier(.23,1,.32,1);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html{overflow-x:hidden;-webkit-text-size-adjust:100%;}
  body{
    font-family:"Jost",system-ui,sans-serif;color:var(--paper);
    background:linear-gradient(170deg,#1a140e,#0c0a07 70%);background-attachment:fixed;
    -webkit-font-smoothing:antialiased;min-height:100dvh;
  }
  /* slim control bar */
  .bar{position:sticky;top:0;z-index:20;display:flex;gap:14px 26px;flex-wrap:wrap;align-items:center;
    padding:calc(env(safe-area-inset-top) + 12px) 18px 12px;
    background:rgba(18,14,10,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--hair);}
  .grp{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .grp .lbl{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-right:2px;}
  .chip{font:inherit;font-size:12.5px;color:var(--paper);background:rgba(255,255,255,.06);
    border:1px solid var(--hair);border-radius:999px;padding:0 14px;height:38px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
    transition:background .18s var(--ease),border-color .18s var(--ease),color .18s var(--ease),transform .12s var(--ease);}
  .chip .dot{width:12px;height:12px;border-radius:50%;border:1px solid rgba(255,255,255,.35);}
  .chip:active{transform:scale(.95);}
  .chip[aria-pressed="true"]{background:var(--mamba);color:#16200a;border-color:var(--mamba);font-weight:600;}
  .chip:focus-visible{outline:2px solid var(--mamba);outline-offset:2px;}
  @media(hover:hover){.chip:hover{border-color:rgba(184,214,43,.5);}}
  /* grid */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:18px 18px 60px;max-width:1320px;margin:0 auto;}
  @media(max-width:1024px){.grid{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:600px){.grid{grid-template-columns:1fr;gap:14px;padding:14px 14px 48px;}}
  .card{border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,.07);
    box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 16px 36px -22px rgba(0,0,0,.85);
    transition:transform .4s var(--ease),box-shadow .3s var(--ease),opacity .5s var(--ease);}
  @media(scripting:enabled){.card{opacity:0;transform:translateY(12px);}.card.in{opacity:1;transform:none;}}
  @media(hover:hover){.card:hover{transform:translateY(-5px);box-shadow:0 22px 46px -22px rgba(0,0,0,.9),0 0 0 1px rgba(184,214,43,.22);}}
  .card:active{transform:scale(.992);transition-duration:.12s;}
  .swatch{background:var(--swatch);min-height:170px;display:flex;align-items:center;justify-content:center;padding:18px 20px;position:relative;}
  @media(max-width:600px){.swatch{min-height:190px;}}
  .swatch::after{content:"";position:absolute;inset:11px;border:1px dashed rgba(255,255,255,.12);border-radius:9px;pointer-events:none;}
  .fig{color:var(--thread);font-size:var(--fig);line-height:1.05;text-align:center;max-width:100%;word-break:break-word;
    text-shadow:0 1px 1px rgba(0,0,0,.55),0 -1px 0 rgba(255,255,255,.10);transition:color .25s var(--ease);}
  .nm{font-size:11px;letter-spacing:.02em;color:var(--muted);padding:9px 14px;background:rgba(8,6,4,.6);border-top:1px solid var(--hair);text-align:center;}
  @media (prefers-reduced-motion: reduce){.card{opacity:1!important;transform:none!important;transition:box-shadow .2s ease;}}
</style>
</head>
<body>
  <div class="bar">
    <div class="grp" id="leathers">
      <span class="lbl">Leather</span>
      <button class="chip" data-leather="mamba" aria-pressed="false"><span class="dot" style="background:#3c5417"></span>Mamba Green</button>
      <button class="chip" data-leather="espresso" aria-pressed="true"><span class="dot" style="background:#4b3624"></span>Espresso</button>
      <button class="chip" data-leather="black" aria-pressed="false"><span class="dot" style="background:#1a1a16"></span>Black</button>
    </div>
    <div class="grp" id="threads">
      <span class="lbl">Thread</span>
      <button class="chip" data-thread="#c9a24a" aria-pressed="true"><span class="dot" style="background:#c9a24a"></span>Gold</button>
      <button class="chip" data-thread="#d4d7db" aria-pressed="false"><span class="dot" style="background:#d4d7db"></span>Silver</button>
      <button class="chip" data-thread="#f4f2ec" aria-pressed="false"><span class="dot" style="background:#f4f2ec"></span>White</button>
      <button class="chip" data-thread="#e7d9b6" aria-pressed="false"><span class="dot" style="background:#e7d9b6"></span>Cream</button>
    </div>
  </div>

  <div class="grid" id="grid"></div>

<script>
  var FONTS=[
    ["Great Vibes"],["Allura"],["Sacramento"],["Parisienne"],["Pinyon Script"],["Alex Brush"],
    ["Tangerine",700],["Yellowtail"],["Dancing Script",600],["Kaushan Script"],["Satisfy"],["Cookie"],
    ["Niconne"],["Mr Dafoe"],["Herr Von Muellerhoff"],["Italianno"],["Petit Formal Script"],["Style Script"],
    ["Playfair Display",600],["Cormorant Garamond",600],["Bodoni Moda",600],["Cinzel",600],["Cinzel Decorative",700],
    ["EB Garamond",600],["Marcellus"],["Forum"],["Italiana"],["Tenor Sans"],["Prata"],["DM Serif Display"],["Bellefair"],["Cardo"],
    ["Montserrat",700],["Oswald",600],["Bebas Neue"],["Anton"],["Archivo Black"],["Poppins",600],["Jost",500],["Josefin Sans",600],
    ["Orbitron",600],["Audiowide"],["Michroma"],["Megrim"],["Monoton"],["Iceland"],["Rajdhani",600],["Syncopate",700],
    ["UnifrakturMaguntia"],["Pirata One"]
  ];
  var LEATHER={
    mamba:"radial-gradient(120% 100% at 28% 0%, rgba(255,255,255,.10), transparent 46%), linear-gradient(158deg,#3c5417,#27380e 68%,#1c2a08)",
    espresso:"radial-gradient(120% 100% at 28% 0%, rgba(255,255,255,.08), transparent 46%), linear-gradient(158deg,#4b3624,#33241a 64%,#2a1c11)",
    black:"radial-gradient(120% 100% at 28% 0%, rgba(255,255,255,.08), transparent 46%), linear-gradient(158deg,#23231d,#151510 68%,#0b0b08)"
  };
  var grid=document.getElementById('grid'), root=document.documentElement;
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  FONTS.forEach(function(f){
    var name=f[0], w=f[1]||400, c=document.createElement('article');
    c.className='card';
    c.innerHTML='<div class="swatch"><span class="fig" style="font-family:\''+name+'\';font-weight:'+w+'">Fig</span></div><div class="nm">'+name+'</div>';
    grid.appendChild(c);
  });
  var cards=Array.prototype.slice.call(grid.children);

  if(!reduce && 'IntersectionObserver' in window){
    var io=new IntersectionObserver(function(es){
      es.filter(function(e){return e.isIntersecting;})
        .sort(function(a,b){return cards.indexOf(a.target)-cards.indexOf(b.target);})
        .forEach(function(e,i){var el=e.target,d=Math.min(i,5)*45;el.style.transitionDelay=d+'ms';el.classList.add('in');io.unobserve(el);
          setTimeout(function(){el.style.transitionDelay='';},560+d);});
    },{rootMargin:'0px 0px -5% 0px',threshold:.05});
    cards.forEach(function(c){io.observe(c);});
  } else { cards.forEach(function(c){c.classList.add('in');}); }

  function wire(id,fn){var g=document.getElementById(id);g.addEventListener('click',function(e){
    var b=e.target.closest('.chip');if(!b)return;
    g.querySelectorAll('.chip').forEach(function(c){c.setAttribute('aria-pressed',c===b?'true':'false');});fn(b);});}
  wire('leathers',function(b){root.style.setProperty('--swatch',LEATHER[b.dataset.leather]);});
  wire('threads',function(b){root.style.setProperty('--thread',b.dataset.thread);});
</script>
</body>
</html>
